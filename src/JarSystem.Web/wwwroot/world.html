<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>世界视图 · 帧流与不变量</title>
<style>
  :root { --bg:#14130f; --panel:#1d1b16; --line:#2e2b24; --ink:#e8e3d6; --dim:#9b9585;
          --ok:#5aa86b; --warn:#c8a03d; --bad:#e05a4e; --accent:#7aa2f7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; gap:14px; align-items:baseline; padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .hint { color:var(--dim); font-size:12px; }
  header .stat { color:var(--dim); font-size:12px; }
  header #level { margin-left:auto; }
  header .stat + .stat { margin-left:12px; }
  header .stat.bad { color:#e0574c; font-weight:600; }
  header .stat.good { color:#72c07d; font-weight:600; }
  .wrap { display:grid; grid-template-columns: 340px 1fr 320px; gap:12px; padding:12px 18px 24px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .panel h2 { font-size:12px; margin:0; padding:8px 10px; border-bottom:1px solid var(--line);
              color:var(--dim); font-weight:600; letter-spacing:.06em; }
  .body { padding:8px 10px; max-height: calc(100vh - 120px); overflow:auto; }
  .ws { border-bottom:1px dashed var(--line); padding:6px 0; }
  .ws:last-child { border-bottom:0; }
  .ws .nm { font-weight:600; }
  .tag { display:inline-block; font-size:11px; padding:0 5px; border-radius:4px; margin-left:6px;
         background:#26241d; color:var(--dim); }
  .tag.master { background:#1f2a1f; color:var(--ok); }
  .tag.slave { background:#1f232c; color:var(--accent); }
  .jars { color:var(--dim); font-size:12px; }
  .ord { padding:4px 0; border-bottom:1px dashed var(--line); font-size:12px; }
  .ord:last-child { border-bottom:0; }
  .frame { font-family: ui-monospace, Consolas, monospace; font-size:12px; padding:1px 0; color:#c9c3b4; }
  .frame .seq { color:#6b665e; }
  .frame .k-worldChanged { color:#8fb3ff; }
  .frame .k-processChanged { color:#8fd6a5; }
  .frame .k-timePaused { color:#e0c56a; }
  .frame .k-timeResumed { color:#e0c56a; }
  .vio { padding:5px 6px; border-radius:5px; margin:4px 0; background:#2a1c1a; border:1px solid #4a2b26; }
  .vio .code { font-family: ui-monospace, Consolas, monospace; color:#ff9b8f; font-size:12px; }
  .vio .msg { color:#e6cfcb; font-size:12px; }
  .okbox { color:var(--ok); padding:6px; }
  .empty { color:var(--dim); padding:6px; }
  button { background:#26241d; color:var(--ink); border:1px solid var(--line); border-radius:6px;
           padding:3px 9px; font-size:12px; cursor:pointer; }
  button:hover { border-color:#4a463b; }
  .row { display:flex; gap:6px; flex-wrap:wrap; padding:6px 10px; border-top:1px solid var(--line); }
  .cmd { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:6px 0; }
  .cmd .lbl { color:var(--dim); font-size:12px; }
  select { background:#26241d; color:var(--ink); border:1px solid var(--line); border-radius:6px;
           padding:2px 6px; font-size:12px; }
  .ord button { margin-left:6px; padding:1px 7px; font-size:11px; }
  .bar { height:5px; background:#26241d; border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; background:#5aa86b; }
  .phases { display:flex; gap:4px; margin-top:4px; }
  .ph { font-size:11px; padding:0 6px; border-radius:4px; background:#26241d; color:#6b665e; }
  .ph.on { color:#14130f; }
  .ph-master.on { background:#7aa2f7; }
  .ph-xfer.on { background:#c8a03d; }
  .ph-slave.on { background:#8fd6a5; }
  .chip { padding:0 5px; border-radius:4px; background:#26241d; color:#9b9585; font-size:11px; margin-right:3px; }
  .chip.b { color:#8fb3ff; }
  .chip.a { color:#8fd6a5; }
  .chip.x { color:#e08a7e; }
  button.chip { padding:1px 7px; font-size:11px; }
  button.chip.on { background:#3a4a6b; color:#e8e3d6; border-color:#4f6f9f; }
  .card { border:1px solid #2e2b24; border-radius:6px; padding:4px 6px; margin:4px 0; }
  .card .cnm { font-weight:600; font-size:12px; margin-bottom:2px; }
</style>
</head>
<body>
<header>
  <h1>世界视图</h1>
  <span class="hint">左侧是内核状态与配置，中间是内核帧流，右侧是不变量检查 —— 全部来自内核，页面不做任何推导。
    世界不会自己走：配置、派单、分析都不推进时间，只有你按「推进一回合」世界才动。</span>
  <span class="stat" id="level">关卡 —</span>
  <span class="stat" id="turns">回合 —</span>
  <span class="stat" id="goal">目标 —</span>
  <span class="stat" id="conn">连接中…</span>
</header>
<div class="hint" id="levelhint" style="padding:0 18px 10px"></div>

<div class="wrap">
  <section class="panel">
    <h2>世界状态（getState）</h2>
    <div class="body" id="state"><div class="empty">等待内核状态…</div></div>
  </section>

  <section class="panel">
    <h2>帧时间线（PresentationFeed）</h2>
    <div class="body" id="frames"><div class="empty">等待帧…</div></div>
    <div class="row">
      <button data-act="tick">推进一回合</button>
      <button data-act="autoround">一回合（下所有可执行的单）</button>
      <button data-act="run">开始走时</button>
      <button data-act="pause">停时</button>
      <button data-act="refresh">刷新状态</button>
      <button data-act="clear">清空列表</button>
    </div>
  </section>

  <section class="panel">
    <h2>不变量（/api/invariants）</h2>
    <div class="body" id="violations"><div class="empty">检查中…</div></div>
  </section>
</div>

<script src="js/world.js"></script>
</body>
</html>
