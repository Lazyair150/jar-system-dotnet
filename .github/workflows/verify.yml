# 最小 CI 闸门：直接复用「唯一验证回路」verify.bat（避免第二份验证逻辑漂移）。
#
# 说明：
#   - verify.bat 现在是**机器可判定**的（内部算 VERDICT，失败时 exit /b 1；设 CI=1 时跳过 pause）。
#   - 因此这里不需要重抄 build/test/schema/config 各步 —— 一旦 verify.bat 变了，CI 自动跟着变。
#   - 运行环境用 windows-latest（与开发机一致：cmd + GBK 控制台 + 中文路径都已验证可用）。
#   - 若 .NET 10 在目标 runner 上仍是预览版，把 dotnet-quality 打开；本项目本地已在 net10.0 上全量验证通过。
#
# 当前的检查内容（全部来自 verify.bat 的 9 步）：
#   1) dotnet build（0 错误）+ Godot 宿主 Release 构建
#   2) JarSystem.Test  → 0 bugs / 2000 random + 0 bugs / 3000 capacity + 32 deterministic
#      JarSystem.Tests → 22 条 xUnit 聚焦测试（含过程内核回归）
#   3) StrategyExperiment
#   4) 契约快照（与基线逐字节一致）
#   5) 契约 JSON Schema（11 类型，total loose=1）+ 前端类型 contract.d.ts（degraded 必须为 0）
#   6) 从 config/world.json 装配的世界 == 内置世界（CONFIG-WORLD-MATCH）
#   7) 协议守卫（命令名/消息名/载荷键/回包载荷键 + 脚本纯 ASCII）
#   8) 求解器差分门（生产求解器 vs 独立参考实现，must be SOLVER-OK）
#   9) 会话回放门（命令日志重放进全新系统，须逐字节一致）
#   +) 质量地板扫描（禁止新增 suppression / 空 catch / 跳过测试 / 核心外部包）

name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # dotnet-quality: 'preview'   # 若 10.0.x 尚未 GA，取消本行注释

      - name: 验证回路（build + 测试基线 + 契约快照 + schema + 配置世界等价）
        shell: cmd
        run: 重构报告\verify.bat

      - name: 失败时上传验证日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: |
            重构报告/_verify_output.txt
            重构报告/_build_output.txt
            重构报告/_contract/
